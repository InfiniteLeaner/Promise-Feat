<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Promise Feats</title>

    <meta name="description" content="Promise Feats — luxury footwear shaped by presence, precision, and timeless style. Discover handcrafted shoes for those who step beyond ordinary.">

    <meta name="keywords" content="Promise Feats, luxury footwear, handcrafted shoes, premium shoes, designer shoes, men's luxury shoes, women's luxury shoes">

    <!-- Open Graph -->
    <meta property="og:title" content="Promise Feats — Luxury Footwear">
    <meta property="og:description" content="Footwear shaped by presence, precision, and timeless style. Step beyond ordinary.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://promise-feat.pages.dev">
    <meta property="og:image" content="./media/images/logo/PF.icon-remove.bg.png">

    <!-- Favicon -->
    <link rel="icon" href="./media/images/logo/PF.icon-remove.bg.png" type="image/png">

    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="./media/images/logo/PF.icon-remove.bg.png">
    <link rel="preload" as="image" href="./media/images/background images/promise-feat-black-background.webp">

    <!-- CSS -->
    <link rel="stylesheet" href="./welcome-page.css">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <!-- Fonts (preconnect speeds up the Poppins @import in welcome-page.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="welcome-page">

    <!-- BACKGROUND VIDEO -->
    <video class="background-video" autoplay muted loop playsinline preload="metadata"
     disablepictureinpicture aria-hidden="true" tabindex="-1"
     poster="./media/images/background images/promise-feat-black-background.webp"
     src="./media/videos/seasonal-ads/thank-you-for-an-absolutely-beautiful-2025..mp4" type="video/mp4">
    </video>

    <!-- HEADER -->
    <header>
        <nav>
            <div class="container">
                <!-- LOGO -->
                <a href="./index.html" class="logo-link">
                    <img src="./media/images/logo/PF.icon-remove.bg.png" alt="Promise Feats Logo" class="logo-img">
                    <span class="brand-name">
                        Promise Feats
                    </span>
                </a>

                <!-- Hamburger / Close toggle (compact badge floats above) -->
                <button type="button" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                  <span class="compact-badge" id="compact-badge" aria-hidden="true">0</span>
                  <i class="bx bx-menu" id="menu-icon" aria-hidden="true"></i>
                </button>

                <!-- NAVIGATION -->
                <ul class="nav-links">
                    <!-- Compact-mode: cart + count inside the open menu -->
                    <li class="compact-menu-cart" id="compact-menu-cart" role="button" tabindex="0" aria-label="Open cart">
                      <i class="bx bxs-shopping-bag" aria-hidden="true">
                        <span class="compact-menu-cart-count" id="compact-menu-cart-count">0</span>
                      </i>
                    </li>
                    <li>
                      <a href="./home-page/home-page.html">
                        Home
                      </a>
                    </li>

                    <li>
                      <a href="./store-page/store.html">
                        Store
                      </a>
                    </li>

                    <li>
                      <a href="./design-page/design.html">
                        Design
                      </a>
                    </li>

                    <li>
                      <a href="./about-us-page/about-us.html">
                        Our Story
                      </a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="nav-overlay" id="nav-overlay"></div>
    </header>

    <!-- HERO SECTION -->
    <main id="main-content">

        <div class="hero-content" id="hero-content">

            <p class="hero-greeting" id="hero-greeting" aria-live="polite">{username}</p>

            <p class="hero-subtitle">
                Your destination for quality products, luxury footwear, premium designs, and timeless style.
            </p>

            <button
                id="begin-journey-btn"
                class="login-btn"
                type="button"
            >
                <span>Begin Your Journey</span>
                <i class="bx bx-right-arrow-alt"></i>
            </button>

        </div>

        <!-- LOGIN PANEL (appears after hero animation) -->
        <section class="login-panel-section" id="login-panel-section" aria-label="Sign In" style="display: none;">
            <div class="login-panel-overlay"></div>
            <div class="login-panel-container">
                <div class="login-panel-inner">
                    <img src="./media/images/logo/PF.icon-remove.bg.png" alt="Promise Feats" class="panel-logo">
                    <h1 class="panel-title">Welcome back</h1>
                    <p class="panel-subtitle">Sign in to your account</p>

                    <form id="login-form" class="auth-form" novalidate>
                        <div class="fields">
                            <label class="field">
                                <i class="bx bx-user" aria-hidden="true"></i>
                                <input type="text" name="username" id="login-username" placeholder=" " autocomplete="username" required aria-describedby="username-error">
                                <label for="login-username">Username</label>
                                <span class="error-message" id="username-error" aria-live="polite"></span>
                            </label>
                            <label class="field">
                                <i class="bx bx-lock-alt" aria-hidden="true"></i>
                                <input type="password" id="login-pw" name="password" placeholder=" " autocomplete="current-password" required aria-describedby="password-error">
                                <button type="button" class="eye-btn" id="login-eye" aria-label="Toggle password" aria-pressed="false">
                                    <i class="bx bx-hide" aria-hidden="true"></i>
                                    <i class="bx bx-show" aria-hidden="true"></i>
                                </button>
                                <label for="login-pw">Password</label>
                                <span class="error-message" id="password-error" aria-live="polite"></span>
                            </label>
                        </div>

                        <div class="form-extras">
                            <label class="remember-me">
                                <input type="checkbox" id="remember-me"> <span>Remember me</span>
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>

                        <button type="submit" class="cta-btn"><span>Sign In</span> <i class="bx bx-right-arrow-alt"></i></button>
                    </form>

                    <p class="switch-prompt">No account? <button type="button" class="text-link" id="go-to-register">Create one</button></p>

                    <button type="button" class="back-link" id="back-to-welcome">
                        <i class="bx bx-arrow-back"></i> <span>Back to Welcome</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- SOCIAL FAB -->
    <div class="fab-container">

        <div class="fab-options" id="fab-options">

            <a
                href="https://web.facebook.com/profile.php?id=100070929678953"
                target="_blank"
                aria-label="Facebook"
            >
                <ion-icon name="logo-facebook"></ion-icon>
            </a>

            <a
                href="https://x.com/promisefeat"
                target="_blank"
                aria-label="Twitter"
            >
                <ion-icon name="logo-twitter"></ion-icon>
            </a>

            <a
                href="https://www.instagram.com/promisefeat/"
                target="_blank"
                aria-label="Instagram"
            >
                <ion-icon name="logo-instagram"></ion-icon>
            </a>

            <a
                href="https://t.co/CE7tc7u11G"
                target="_blank"
                aria-label="WhatsApp"
            >
                <ion-icon name="logo-whatsapp"></ion-icon>
            </a>

        </div>

        <button
            id="fab-btn"
            aria-label="Open Social Menu"
        >
            <i class="bx bx-plus"></i>
        </button>

    </div>

</div>

<!-- JavaScript -->
<script src="./cart.js"></script>
<script src="./welcome-page.js"></script>

</body>
</html>
