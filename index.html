<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Promise Feats</title>

    <meta name="description" content="Shop quality products and services at Promise Feats. Explore our store, designs, and more with secure checkout and responsive browsing.">

    <meta name="keywords" content="Promise Feats, luxury shoes, footwear, fashion, online store, premium shoes, men's shoes, women's shoes">

    <!-- Open Graph -->
    <meta property="og:title" content="Promise Feats">
    <meta property="og:description" content="Your destination for quality products and services.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://promise-feat.pages.dev">
    <meta property="og:image" content="./media/images/logo/PF.icon-remove.bg.png">

    <!-- Favicon -->
    <link rel="icon" href="./media/images/logo/PF.icon-remove.bg.png" type="image/png">

    <!-- CSS -->
    <link rel="stylesheet" href="./welcome-page.css">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <!-- Preload Video -->
    <link rel="preload" href="./media/videos/seasonal-ads/thank-you-for-an-absolutely-beautiful-2025..mp4" as="video" type="video/mp4">
</head>

<body>

<div class="welcome-page">

    <!-- BACKGROUND VIDEO -->
    <video class="background-video" autoplay muted loop playsinline
     src="./media/videos/seasonal-ads/thank-you-for-an-absolutely-beautiful-2025..mp4" type="video/mp4">
    </video>

    <!-- HEADER -->
    <header>
        <nav>
            <!-- LOGO -->
            <a href="./index.html" class="logo-link">
                <img src="./media/images/logo/PF.icon-remove.bg.png" alt="Promise Feats Logo" class="logo">

                <span class="brand-name">
                    Promise Feat
                </span>
            </a>

            <!-- MOBILE MENU BUTTON -->
            <button id="menu-toggle" aria-label="Toggle Navigation" aria-expanded="false">
                <i class="bx bx-menu"></i>
            </button>

            <!-- NAVIGATION -->
            <ul class="nav-links">
                <li>
                  <a href="./home-page/home-page.html">
                    Home
                  </a>
                </li>

                <li>
                  <a href="./store-page/store.html">
                    Store
                  </a>
                </li>

                <li>
                  <a href="./design-page/design.html">
                    Design
                  </a>
                </li>

                <li>
                  <a href="./about-us-page/about-us.html">
                     About-Us
                  </a>
                </li>
            </ul>
        </nav>

    </header>

    <!-- HERO SECTION -->
    <main id="main-content">

        <div class="hero-content">

            <h1 class="hero-title">
                Welcome To Promise Feats
            </h1>

            <p class="hero-subtitle">
                Your destination for quality products, luxury footwear,
                premium designs, and exceptional services.
            </p>

            <a
                href="./login-page/login.html"
                class="login-btn"
            >
                Get Started!
            </a>

        </div>

    </main>

    <!-- SOCIAL FAB -->
    <div class="fab-container">

        <div class="fab-options" id="fab-options">

            <a
                href="https://web.facebook.com/profile.php?id=100070929678953"
                target="_blank"
                aria-label="Facebook"
            >
                <ion-icon name="logo-facebook"></ion-icon>
            </a>

            <a
                href="https://x.com/promisefeat"
                target="_blank"
                aria-label="Twitter"
            >
                <ion-icon name="logo-twitter"></ion-icon>
            </a>

            <a
                href="https://www.instagram.com/promisefeat/"
                target="_blank"
                aria-label="Instagram"
            >
                <ion-icon name="logo-instagram"></ion-icon>
            </a>

            <a
                href="https://t.co/CE7tc7u11G"
                target="_blank"
                aria-label="WhatsApp"
            >
                <ion-icon name="logo-whatsapp"></ion-icon>
            </a>

        </div>

        <button
            id="fab-btn"
            aria-label="Open Social Menu"
        >
            <i class="bx bx-plus"></i>
        </button>

    </div>

</div>

<!-- JavaScript -->
<script src="./welcome-page.js"></script>

</body>
</html>
