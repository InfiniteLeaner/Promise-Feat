<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Promise Feats | Design Studio</title>
  <link rel="stylesheet" href="./design.css" />
  <link rel="icon" href="../media/images/logo/PF.icon-remove.bg.png" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <header>
      <nav>
      <div class="container">
        <a href="../index.html" class="logo-link">
          <img class="logo-img" src="../media/images/logo/PF.icon-remove.bg.png" alt="Promise Feats Logo">
          <span class="brand-name">Promise Feat</span>
        </a>

        <!-- Hamburger / Close toggle (compact badge floats above) -->
        <button type="button" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span class="compact-badge" id="compact-badge" aria-hidden="true">0</span>
          <i class="bx bx-menu" id="menu-icon" aria-hidden="true"></i>
        </button>

          <ul class="nav-links">
            <!-- Compact-mode: cart + count inside the open menu -->
            <li class="compact-menu-cart" id="compact-menu-cart" role="button" tabindex="0" aria-label="Open cart">
              <i class="bx bxs-shopping-bag" aria-hidden="true">
                <span class="compact-menu-cart-count" id="compact-menu-cart-count">0</span>
              </i>
            </li>

            <li><a href="../home-page/home-page.html">Home</a></li>
            <li><a href="../store-page/store.html">Store</a></li>
            <li><a href="../design-page/design.html">Design</a></li>
            <li><a href="../about-us-page/about-us.html">About-Us</a></li>
            <li class="drawer-actions">
              <a href="../store-page/store.html">
                <button class="buynow-btn" type="button">Buy Now</button>
              </a>
            </li>
            <li class="drawer-actions">
              <a href="../login-page/login.html">
                <button class="login-btn" type="button">Login</button>
              </a>
            </li>

          </ul>

          <div class="nav-actions">

            <div class="search">
              <input class="srch" type="search" placeholder="Type here">
              <button class="srch-btn">
                Search <i class="bx bx-search-alt-2"></i>
              </button>
            </div>

            <a href="../store-page/store.html" class="desktop-only buynow-wrap">
              <button class="buynow-btn">Buy Now</button>
            </a>

            <a href="../login-page/login.html" class="desktop-only">
              <button class="login-btn">Login</button>
            </a>

            <div class="icon-cart">
              <i class="bx bxs-shopping-bag" aria-hidden="true"></i>
              <span id="cart-count">0</span>
            </div>

          </div>
      </div>
      </nav>
    </header>
    <div class="nav-overlay" id="nav-overlay"></div>

  <main>
    <section class="hero-text">
      <p class="studio-eyebrow">Design Studio</p>
      <h1>Design Your Own Shoe</h1>
      <p>
        Create your custom premium shoe with real-time 3D preview,
        colors, sizes, and styling options.
      </p>
    </section>

    <section class="designer">
      <div class="viewer-container">
        <model-viewer
          id="shoe-viewer"
          src="../media/3d-models/mens_slacks_and_shoes.glb"
          alt="3D Shoe"
          camera-controls
          auto-rotate
          environment-image="neutral"
          tone-mapping="commerce"
          shadow-intensity="1"
          exposure="1"
          loading="eager"
          ar
          ar-modes="scene-viewer webxr quick-look"
        ></model-viewer>
      </div>

      <aside class="controls">
        <div class="row">
          <div>
            <h3>Shoe Name</h3>
            <input type="text" id="shoe-name" placeholder="Enter shoe name" />
          </div>

          <div>
            <h3>Quantity</h3>
            <input type="number" id="qty" value="1" min="1" />
          </div>
        </div>

        <h3>Parts</h3>
        <div class="parts">
          <button class="part-btn active" data-part="body">Body</button>
          <button class="part-btn" data-part="laces">Laces</button>
          <button class="part-btn" data-part="sole">Sole</button>
          <button class="part-btn" data-part="tongue">Tongue</button>
        </div>

        <h3>Colors</h3>
        <div class="colors">
          <button class="color-btn active" data-color="#000000" data-name="Black" aria-label="Black"></button>
          <button class="color-btn" data-color="#d33" data-name="Crimson" aria-label="Crimson"></button>
          <button class="color-btn" data-color="#3366ff" data-name="Royal Blue" aria-label="Royal Blue"></button>
          <button class="color-btn" data-color="#ffffff" data-name="White" aria-label="White"></button>
        </div>

        <h3>Sizes</h3>
        <div class="sizes">
          <button class="size-btn" data-size="38">38</button>
          <button class="size-btn" data-size="39">39</button>
          <button class="size-btn active" data-size="40">40</button>
          <button class="size-btn" data-size="41">41</button>
          <button class="size-btn" data-size="42">42</button>
        </div>

        <div class="actions">
          <div class="selected-info">
            Selected Size: <span id="selected-size">40</span>
          </div>
          <button class="add-btn" id="add-to-cart">Add To Cart</button>
        </div>

        <p class="selection-summary" id="selection-summary" aria-live="polite"></p>
      </aside>
    </section>
  </main>
  <!-- SOCIAL FAB (same floating social menu as the welcome page) -->
  <div class="fab-container">
    <div class="fab-options" id="fab-options">
      <a href="https://web.facebook.com/profile.php?id=100070929678953" target="_blank" rel="noopener" aria-label="Facebook">
        <ion-icon name="logo-facebook"></ion-icon>
      </a>
      <a href="https://x.com/promisefeat" target="_blank" rel="noopener" aria-label="Twitter">
        <ion-icon name="logo-twitter"></ion-icon>
      </a>
      <a href="https://www.instagram.com/promisefeat/" target="_blank" rel="noopener" aria-label="Instagram">
        <ion-icon name="logo-instagram"></ion-icon>
      </a>
      <a href="https://t.co/CE7tc7u11G" target="_blank" rel="noopener" aria-label="WhatsApp">
        <ion-icon name="logo-whatsapp"></ion-icon>
      </a>
    </div>
    <button id="fab-btn" aria-label="Open Social Menu">
      <i class="bx bx-plus"></i>
    </button>
  </div>

  <script src="../cart.js"></script>
  <script src="./design.js"></script>
</body>
</html>
