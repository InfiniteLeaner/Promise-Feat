      <i class="bx bxs-shopping-bag" aria-hidden="true"></i>

      <ul class="nav-links" id="primary-nav">

        <li><a href="../design-page/design.html">Design</a></li>
        <li><a href="../about-us-page/about-us.html">About-Us</a></li>

        <li class="nav-mobile-actions">
          <a href="../store-page/store.html" class="buynow-wrap"><button class="buynow-btn">Buy Now</button></a>
          <a href="../login-page/login.html"><button class="login-btn">Login</button></a>
        </li>

      </ul>

      <div class="nav-actions">

        <div class="search">
          <input class="srch" type="search" placeholder="Type here" aria-label="Search products">

            Search <i class="bx bx-search-alt-2" aria-hidden="true"></i>
          </button>
        </div>

        <a href="../store-page/store.html" class="desktop-only buynow-wrap">
          <button class="buynow-btn">Buy Now</button>
        </a>

        <a href="../login-page/login.html" class="desktop-only">
          <button class="login-btn">Login</button>
        </a>

          <i class="bx bxs-shopping-bag" aria-hidden="true"></i>
          <span id="cart-count">0</span>
        </div>

      </div>
  </div>
  </nav>

<div class="nav-overlay" id="nav-overlay"></div>

<!-- ================= CAROUSEL ================= -->
<section class="carousel" aria-roledescription="carousel" aria-label="Featured products">

  <div class="list">

    <div class="item">
      <img src="../media/images/background images/promise-feat-white-background.webp" alt="White Background Hero" fetchpriority="high" draggable="false">
      <div class="content">
        <div class="author">KC.Prince</div>
        <div class="title">Promise Feats<span class="title-bar" aria-hidden="true"></span></div>
        <div class="topic">Foot Wears</div>
        <div class="des">Best Outfits, Quality and Trustworthy</div>
        <div class="buttons">
          <button class="See-more">SEE MORE</button>
          <button class="Subscribe">SUBSCRIBE</button>
        </div>
      </div>
    </div>

    <div class="item">
      <img src="../media/images/background images/promise-feat-black-background.webp" alt="Black Background Hero" loading="lazy" draggable="false">
      <div class="content">
        <div class="author">KC.Prince</div>
        <div class="title">Promise Feats<span class="title-bar" aria-hidden="true"></span></div>
        <div class="topic">Foot Wears</div>
        <div class="des">Best Outfits, Quality and Trustworthy</div>
        <div class="buttons">
          <button class="See-more">SEE MORE</button>
          <button class="Subscribe">SUBSCRIBE</button>
        </div>
      </div>
    </div>

  </div>

    <div class="thumbnail-track">

      <div class="item" role="tab" tabindex="0" aria-label="Show slide 1">
        <img src="../media/images/promise-feat-footwears/black-leather-shoes/black-leather-img.14.jpg" alt="Black Shoe 1" loading="lazy">
        <button type="button" class="thumb-add" data-id="black-sneaker-11" data-name="Black Minimalist Sneaker" data-price="50000" aria-label="Add Black Minimalist Sneaker to cart"><i class="bx bx-plus"></i></button>
      </div>
      <div class="item" role="tab" tabindex="0" aria-label="Show slide 2">
        <img src="../media/images/promise-feat-footwears/brown-leather-shoes/brown-leather-img.14.webp" alt="Brown Shoe 1" loading="lazy">
        <button type="button" class="thumb-add" data-id="brown-casual-2" data-name="Brown Casual Leather Shoe" data-price="34000" aria-label="Add Brown Casual Leather Shoe to cart"><i class="bx bx-plus"></i></button>
      </div>
      <div class="item" role="tab" tabindex="0" aria-label="Show slide 3">
        <img src="../media/images/promise-feat-footwears/black-leather-shoes/black-leather-img.13.jpg" alt="Black Shoe 2" loading="lazy">
        <button type="button" class="thumb-add" data-id="black-sneaker-10" data-name="Black Minimalist Sneaker" data-price="20000" aria-label="Add Black Minimalist Sneaker to cart"><i class="bx bx-plus"></i></button>
      </div>
      <div class="item" role="tab" tabindex="0" aria-label="Show slide 4">
        <img src="../media/images/promise-feat-footwears/brown-leather-shoes/brown-leather-img.13.webp" alt="Brown Shoe 2" loading="lazy">
        <button type="button" class="thumb-add" data-id="brown-casual-3" data-name="Brown Casual Leather Shoe" data-price="49000" aria-label="Add Brown Casual Leather Shoe to cart"><i class="bx bx-plus"></i></button>
      </div>

    </div>

  </div>

  <!-- ARROWS -->
  <div class="arrows">
    <button id="prev" aria-label="Previous slide">❮</button>
    <button id="next" aria-label="Next slide">❯</button>
  </div>

</section>
